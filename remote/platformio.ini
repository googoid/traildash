; Remote IMU for the inclinometer: Seeed XIAO ESP32-C6 + MPU-6050/6500 on I2C.
; Mount it where the car's pitch/roll should be measured; it streams raw samples
; to the inclinometer over BLE (protocol: ../shared/imu_link.h).

[env:xiao-c6]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = seeed_xiao_esp32c6
framework = arduino

build_flags =
    -I../shared
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER_DISABLED

monitor_speed = 115200

lib_deps =
    h2zero/NimBLE-Arduino@^2.5.2
